<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f9e9ea;
      font-family: Arial, sans-serif;
    }
    .placeholder {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #fce4e6, #f5c6cb);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #d49b9f;
      font-size: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <div class="icon">💎</div>
    <div>Pearlette.pk</div>
    <div style="font-size: 16px; margin-top: 10px;">Premium Jewelry</div>
  </div>
</body>
</html>
